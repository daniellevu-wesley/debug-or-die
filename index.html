<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug or Die Trying</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060e;--sur:#0d0d1a;--bor:#2a2a45;
  --amb:#e8913a;--ambL:#ffc060;--ambD:#7a3d10;
  --cyn:#3ecfcf;--cynL:#80ffff;
  --txt:#eee8ff;--mut:#6a6480;--dim:#1e1c2e;
  --red:#e05050;--grn:#40d880;
  --ff:'Courier New',monospace;--serif:Georgia,serif;
}
html,body{background:var(--bg);color:var(--txt);font-family:var(--ff);min-height:100vh;overflow-x:hidden}
button{font-family:var(--ff);cursor:pointer;transition:opacity .2s}
button:hover:not(:disabled){opacity:.85}
button:disabled{opacity:.4;cursor:default}
input{font-family:var(--ff)}
canvas{display:block}
#app{min-height:100vh;position:relative}
#rain{position:fixed;inset:0;pointer-events:none;z-index:0}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(6,6,14,.9) 100%);pointer-events:none;z-index:1}
.lay{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:clamp(.8rem,3vw,1.8rem) clamp(.8rem,3vw,1.4rem)}
.col{display:flex;flex-direction:column;align-items:center}
.panel{background:rgba(10,10,20,.92);border:1px solid var(--bor);border-radius:4px}
.panel-c{background:rgba(6,6,14,.97);border:1px solid var(--cyn);border-radius:4px;position:relative}
.panel-c::before,.panel-c::after{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyn),transparent)}
.panel-c::before{top:0}.panel-c::after{bottom:0}
.btn{background:transparent;border:1.5px solid var(--amb);color:var(--amb);font-family:var(--serif);font-size:clamp(10px,2vw,13px);letter-spacing:.2em;padding:clamp(8px,2vw,11px) clamp(14px,3.5vw,28px);clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%)}
.btn-c{border-color:var(--cyn)!important;color:var(--cyn)!important}
.btn-r{border-color:var(--red)!important;color:var(--red)!important}
.btn-s{background:transparent;border:1px solid var(--bor);color:var(--mut);font-size:clamp(9px,1.8vw,11px);letter-spacing:.15em;padding:clamp(6px,1.5vw,9px) clamp(10px,2.5vw,18px)}
.btn-s:hover:not(:disabled){border-color:var(--mut);color:var(--txt)}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(6px,1.5vh,10px)}
.tbar{height:4px;background:var(--sur);border-radius:2px;border:1px solid var(--bor);overflow:hidden;margin-bottom:3px}
.tfill{height:100%;border-radius:2px;transition:width 1s linear,background .4s}
.arena-w{position:relative;width:100%;padding-bottom:23%;border:1px solid var(--bor);border-radius:4px;overflow:hidden;margin-bottom:clamp(10px,2vh,14px)}
.arena-w>div{position:absolute;inset:0}
.fov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,9px);margin-bottom:clamp(8px,1.8vh,12px)}
.opt{background:rgba(10,10,22,.8);border:1px solid var(--bor);color:var(--txt);padding:clamp(9px,2vw,13px) clamp(8px,2vw,11px);border-radius:4px;font-size:clamp(11px,2.2vw,13px);text-align:left;line-height:1.4;transition:border .15s,background .15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--acc,var(--amb))}
.opt.ok{border:2px solid var(--grn)!important;color:var(--grn)!important;background:rgba(64,216,128,.06)}
.opt.no{border:2px solid var(--red)!important;color:var(--red)!important;background:rgba(224,80,80,.06)}
.opt.hl{border:2px solid var(--amb)!important;color:var(--ambL)!important;background:rgba(232,145,58,.07)}
.opt.el{opacity:.25;text-decoration:line-through;cursor:default}
.code-b{background:rgba(0,0,0,.65);border-left:2px solid var(--amb);color:var(--ambL);padding:clamp(8px,2vw,12px);font-size:clamp(10px,2.2vw,12px);line-height:1.8;overflow-x:auto;margin-bottom:10px;white-space:pre;font-family:var(--ff);border-radius:0 4px 4px 0}
.duck-row{display:flex;align-items:flex-end;gap:clamp(6px,1.5vw,10px);margin-top:clamp(6px,1.5vh,10px)}
.dbub{padding:7px clamp(10px,2.5vw,14px);font-size:clamp(10px,1.8vw,12px);color:var(--mut);font-style:italic;line-height:1.5;max-width:min(320px,72vw)}
.badge{font-size:clamp(7px,1.4vw,9px);letter-spacing:.2em;padding:3px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.ban{position:fixed;top:clamp(58px,10vh,78px);left:50%;transform:translateX(-50%);padding:9px 24px;font-family:var(--serif);letter-spacing:.2em;white-space:nowrap;z-index:40;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);background:var(--sur)}
.ban-a{border:1px solid var(--ambD);color:var(--amb);font-size:clamp(8px,1.8vw,11px)}
.ban-c{border:1px solid var(--cyn);color:var(--cyn);font-size:clamp(8px,1.8vw,11px);top:clamp(98px,16vh,118px)}
.stat-g{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:clamp(10px,2.5vh,16px)}
.stat-c{padding:clamp(8px,2vw,12px) clamp(10px,2.5vw,16px);text-align:center;min-width:78px}
.lb-r{display:flex;justify-content:space-between;font-size:clamp(10px,2vw,12px);padding:5px 12px;border-radius:4px;margin-bottom:3px;border:1px solid var(--bor)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:60}
.mbox{background:#05050d;border:1px solid var(--bor);border-top:1px solid var(--cyn);border-radius:6px;padding:clamp(14px,3vw,22px);max-width:min(460px,94vw);width:94%;max-height:80vh;overflow-y:auto}
.gold-zone{background:var(--qzbg,rgba(232,145,58,.12));border:1px solid var(--qzbd,rgba(255,192,96,.21));border-radius:6px}
.q-text-gold{font-size:clamp(12px,2.8vw,15px);color:var(--accL,var(--ambL));line-height:1.5;margin:0;padding:clamp(10px,2.5vw,14px) clamp(12px,3vw,16px)}
.type-box{background:transparent;border:none;color:var(--ambL);font-size:clamp(13px,2.5vw,15px);font-family:var(--ff);outline:none;width:100%;box-sizing:border-box;padding:clamp(10px,2vw,12px) clamp(12px,3vw,16px)}
.type-box::placeholder{color:rgba(255,192,96,.40);font-style:italic}
.type-box.ok{color:var(--grn)}
.type-box.no{color:var(--red)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--sur)}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:2px}
</style>
</head>

<script>

function sbQ(table,method,body,params){
  method=method||"GET";params=params||"";
  var url=SB_URL+"/rest/v1/"+table+params;
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json",
    "Prefer":method==="POST"?"return=representation":method==="PATCH"?"return=representation":""};
  return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):null})

}
var sb={

  upsertProfile:function(p){return sbQ("profiles","POST",p,"?on_conflict=name");},
  updateProfile:function(n,d){return sbQ("profiles","PATCH",d,"?name=eq."+encodeURIComponent(n.toLowerCase()));},
  getLB:function(){return sbQ("leaderboard","GET",null,"?order=best_score.desc&limit=15").then(function(r){return r||[];});},
  upsertLB:function(row){return sbQ("leaderboard","POST",row,"?on_conflict=name");},
  getCS:function(id){return sbQ("class_state","GET",null,"?id=eq."+id+"&limit=1").then(function(r){return r&&r[0]?r[0]:null;});},
  setCS:function(id,d){return sbQ("class_state","PATCH",{data:d,updated_at:new Date().toISOString()},"?id=eq."+id);},
  getAllProfiles:function(){return sbQ("profiles","GET",null,"?order=best_score.desc").then(function(r){return r||[];});}
};
var LS="dodt_v3";
var ls={
  get:function(n){try{return JSON.parse(localStorage.getItem(LS)||"{}")[n.toLowerCase()]||null;}catch(e){return null;}},
  set:function(n,d){try{var a=JSON.parse(localStorage.getItem(LS)||"{}");a[n.toLowerCase()]=d;localStorage.setItem(LS,JSON.stringify(a));}catch(e){}},
  getLB:function(){try{return JSON.parse(localStorage.getItem(LS+"_lb")||"[]");}catch(e){return[];}},
  setLB:function(lb){try{localStorage.setItem(LS+"_lb",JSON.stringify(lb));}catch(e){}}
};
function loadProfile(name){return sb.getProfile(name).then(function(r){return r||ls.get(name);});}
function saveProfile(p){
  ls.set(p.name,p);
  return sb.getProfile(p.name).then(function(ex){
    var data={best_score:p.best_score,total_score:p.total_score,benchmark:p.benchmark,session_count:p.session_count,wrong_ids:p.wrong_ids,lore_lib:p.lore_lib,evo_stage:p.evo_stage,last_seen:new Date().toISOString()};
    if(ex)return sb.updateProfile(p.name,data);
    return sb.upsertProfile(Object.assign({},p,{last_seen:new Date().toISOString()}));
  });
}
function loadLB(){return sb.getLB().then(function(r){return(r&&r.length)?r:ls.getLB();});}
function updateLB(name,best_score,benchmark){
  return loadLB().then(function(lb){
    var next=lb.filter(function(e){return e.name.toLowerCase()!==name.toLowerCase();});
    next.push({name:name,best_score:best_score,benchmark:benchmark,updated_at:new Date().toISOString()});
    next.sort(function(a,b){return b.best_score-a.best_score;});
    next=next.slice(0,15);
    ls.setLB(next);
    return sb.upsertLB({name:name,best_score:best_score,benchmark:benchmark,updated_at:new Date().toISOString()}).then(function(){return next;});
  });
}
function emptyProfile(name){return{name:name.toLowerCase(),best_score:0,total_score:0,benchmark:1,session_count:0,wrong_ids:[],lore_lib:[],evo_stage:0};}

var C={bg:"#06060e",sur:"#0d0d1a",bor:"#2a2a45",amb:"#e8913a",ambL:"#ffc060",ambD:"#7a3d10",cyn:"#3ecfcf",cynL:"#80ffff",txt:"#eee8ff",mut:"#6a6480",dim:"#1e1c2e",red:"#e05050",grn:"#40d880",tCols:["#e05050","#3ecfcf","#c45c8a","#40d880"],tNames:["Team Undefined","Team NaN","Team Null","Team Overflow"]};
var BM_LABELS={"b1":"Benchmark I — Basic Syntax","b2":"Benchmark II — Decisions & Loops","b3":"Benchmark III — The Builder","b4":"Benchmark IV — Deep Reading","b5":"Benchmark V — Mastery Arc"};
var EVO_LABELS=["Egg","Bit","Bit the Coder","Bit the Detective","Bit the Wizard"];
var BOSSES=[{name:"Kevin the Corrupted Loop",flavor:"Loops forever. Refuses to stop.",hp:100},{name:"Sandra the Stack Overflow",flavor:"Has opinions. Too many.",hp:120},{name:"Gary the Undefined",flavor:"Exists. Probably.",hp:90},{name:"Patricia the Null Pointer",flavor:"Points nowhere. Committed to it.",hp:110}];
var WAVE_CFG=[{label:"WAVE I",t:9999},{label:"WAVE II — FASTER",t:9999},{label:"WAVE III — UNHINGED",t:9999}];
var SPEED_THRESH=0.65;
function getBMKey(total){if(total>=5500)return"b5";if(total>=3000)return"b4";if(total>=1500)return"b3";if(total>=600)return"b2";return"b1";}
function getEvo(total){if(total>=3000)return 4;if(total>=1500)return 3;if(total>=600)return 2;if(total>=200)return 1;return 0;}
function curBM(){return (typeof G!=="undefined"&&G&&G.worldOverride)||getBMKey((typeof G!=="undefined"&&G&&G.profile)?G.profile.total_score||0:0);}
function nextBM(){var o=["b1","b2","b3","b4","b5"],i=o.indexOf(curBM());return i>-1&&i<4?o[i+1]:null;}
function playNextWorld(){var n=nextBM();if(!n||!worldPassed(n))return;G.worldOverride=n;startGame();}
var WORLD_THRESH={b1:0,b2:600,b3:1500,b4:3000,b5:5500};
function worldPassed(bm){return ((typeof G!=="undefined"&&G&&G.profile)?G.profile.total_score||0:0)>=WORLD_THRESH[bm];}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){return[].concat(a).sort(function(){return Math.random()-.5;});}
var DC={
  correct:["Not bad.","Correct.","Reluctant nod.","Acceptable."],
  wrong:["Wrong.","Duck is unsurprised.","Bold choice. Wrong one.","Mmm. No."],
  h1:["Think about plain English.","One is clearly not code."],

};
var RAW_Q={"b1":[{"id":"b1q01","type":"mc","q":"Which of these is a JavaScript keyword?","opts":["var","spaghetti","monitor","click"],"a":"var","lore":{"concept":"var declares a variable, a named container for a value.","code":"var score = 0;","analogy":"Like writing your name on your lunch in the fridge."},"tag":"naming"},{"id":"b1q02","type":"mc","q":"True or false: every JS statement ends with a semicolon","opts":["True","False","Only on Tuesdays","Only if nervous"],"a":"True","lore":{"concept":"Semicolons end statements like a full stop ends a sentence.","code":"let x = 5;","analogy":"JavaScript saying: done with that thought."},"tag":"output"},{"id":"b1q03","type":"fill","q":"Complete the line to store the number 5 in a variable called x","template":"___ x = 5;","answer":"let","alsoAccept":["var","const"],"hint":"The keyword that declares a variable","lore":{"concept":"let creates a variable and assigns it a value.","code":"let x = 5;","analogy":"A sticky note to JavaScript: remember this number is 5."},"tag":"variables"},{"id":"b1q04","type":"mc","q":"Which does not belong with the others?","opts":["if","else","while","avocado"],"a":"avocado","lore":{"concept":"if, else, while are control flow keywords. Avocado is a fruit.","code":"if (hungry) { eat(); }","analogy":"Avocado is delicious. Not a keyword. Yet."},"tag":"conditionals"},{"id":"b1q05","type":"fill","q":"Declare a variable called score starting at zero","template":"___ score = 0;","answer":"let","alsoAccept":["var","const"],"hint":"Three letters that declare a variable","lore":{"concept":"let declares variables that can change later.","code":"let score = 0;","analogy":"A whiteboard. Write, erase, write again."},"tag":"variables"},{"id":"b1q06","type":"mc","q":"What is a variable?","opts":["A box storing a value","A type of bug","A keyboard shortcut","A font size"],"a":"A box storing a value","lore":{"concept":"Variables store data: numbers, text, lists.","code":"let name = 'Bit';","analogy":"A labelled jar. Label is the name. Contents are the value."},"tag":"variables"},{"id":"b1q07","type":"mc","q":"Which symbol assigns a value in JS?","opts":["=","==","=>","!="],"a":"=","lore":{"concept":"Single = assigns. Double == checks equality.","code":"let x = 10;","analogy":"One equals puts it in the box. Two equals checks what is there."},"tag":"comparison"},{"id":"b1q08","type":"mc","q":"True or false: a loop repeats code","opts":["True","False","Only on weekdays","Loops are a myth"],"a":"True","lore":{"concept":"A loop runs the same block of code multiple times.","code":"for (let i = 0; i < 3; i++) { }","analogy":"JS is too lazy to write the same line 100 times."},"tag":"loops"},{"id":"b1q09","type":"predict","q":"What does this print?","code":"console.log('hello');","answer":"hello","hint":"It prints exactly what is inside the quotes","lore":{"concept":"console.log() prints output to the developer console.","code":"console.log('Hello!');","analogy":"JavaScript whispering notes only developers can see."},"tag":"output"},{"id":"b1q10","type":"mc","q":"Which of these is a string?","opts":["'hello'","42","true","null"],"a":"'hello'","lore":{"concept":"A string is text wrapped in quotes.","code":"let msg = 'hello';","analogy":"Words in a costume. The quotes are the costume."},"tag":"types"},{"id":"b1q12","type":"mc","q":"What does // do in JS?","opts":["Marks a comment JS ignores","Divides two numbers","Creates a URL","Runs a secret command"],"a":"Marks a comment JS ignores","lore":{"concept":"Comments are notes in code that JS ignores.","code":"// note to self\nlet x = 5;","analogy":"A sticky note for future-you."},"tag":"comments"},{"id":"b1q13","type":"mc","q":"What type is the value 42?","opts":["Number","String","Boolean","Object"],"a":"Number","lore":{"concept":"42 is a number. Numbers in JS have no quotes.","code":"let age = 42;","analogy":"No quotes means JS treats it as a number."},"tag":"types"},{"id":"b1q14","type":"fill","q":"Complete the line to declare a constant","template":"___ MAX = 100;","answer":"const","hint":"The keyword for a value that never changes","lore":{"concept":"const declares a value that cannot be reassigned.","code":"const MAX = 100;","analogy":"A permanent marker. Write once, done."},"tag":"variables"},{"id":"b1q15","type":"bug","q":"Tap the line that has a bug","lines":["let score = 0;","score = score + 1;","consol.log(score);","let name = 'Bit';"],"bugLine":2,"lore":{"concept":"console.log is spelled c-o-n-s-o-l-e. A typo stops it working.","code":"console.log(score);","analogy":"One wrong letter and JavaScript has no idea what you mean."},"tag":"naming"},{"id":"b1n01","type":"mc","q":"What does console.log('score') print?","opts":["score","the value of a variable called score","an error","nothing"],"a":"score","tag":"output","lore":{"concept":"Quotes make literal text — JS prints exactly what is inside them.","code":"console.log('score'); // score","analogy":"Quotes are a costume: whatever wears them is just text."}},{"id":"b1n02","type":"predict","q":"What does this print?","code":"let x = 10;\nconsole.log(x);","answer":"10","hint":"No quotes on x — JS prints its stored value","tag":"variables","lore":{"concept":"No quotes on x, so JS prints the value stored in it.","code":"let x = 10;","analogy":"The label on the jar vs what is in the jar."}},{"id":"b1n03","type":"mc","q":"Which line creates a value that can never be reassigned?","opts":["const pi = 3.14;","let pi = 3.14;","var pi = 3.14;","pi = 3.14;"],"a":"const pi = 3.14;","tag":"variables","lore":{"concept":"const locks the assignment; let and var stay changeable.","code":"const pi = 3.14;","analogy":"Written in pen, not pencil."}},{"id":"b1n04","type":"fill","q":"Declare lives (you plan to change it later)","template":"___ lives = 3;","answer":"let","alsoAccept":["var"],"hint":"The modern keyword for changeable variables","tag":"variables","lore":{"concept":"let is the modern keyword for changeable variables.","code":"let lives = 3;","analogy":"A whiteboard number, not a tattoo."}},{"id":"b1n05","type":"predict","q":"What does this print?","code":"console.log(5 + 5);","answer":"10","hint":"No quotes — real maths","tag":"types","lore":{"concept":"Numbers without quotes do real maths.","code":"5 + 5 // 10","analogy":"A calculator, as expected."}},{"id":"b1n06","type":"predict","q":"What does this print?","code":"console.log('5' + '5');","answer":"55","hint":"Quotes make text — plus glues text","tag":"types","lore":{"concept":"Quoted values are text — plus glues text together instead of adding.","code":"'5' + '5' // '55'","analogy":"Two fridge magnets pushed together, not added."}},{"id":"b1n07","type":"mc","q":"What is 'true' (with quotes)?","opts":["a string","a boolean","a number","an error"],"a":"a string","tag":"types","lore":{"concept":"Quotes override everything — it is text that says true.","code":"typeof 'true' // 'string'","analogy":"A photo of a key is not a key."}},{"id":"b1n08","type":"bug","q":"Tap the line with a bug","lines":["Let hp = 100;","hp = hp - 10;","console.log(hp);","// damage applied"],"bugLine":0,"tag":"naming","lore":{"concept":"Keywords are lowercase — JS is case-sensitive.","code":"let hp = 100;","analogy":"JS reads LET, Let and let as three different words."}},{"id":"b1n09","type":"mc","q":"myScore works but my score breaks. Why?","opts":["variable names cannot contain spaces","score is a keyword","names need a number","it does not break"],"a":"variable names cannot contain spaces","tag":"naming","lore":{"concept":"One name, no spaces — that is why coders use camelCase.","code":"let myScore = 0;","analogy":"A username, not a sentence."}},{"id":"b1n10","type":"fill","q":"Make JS ignore this line","template":"___ heals the player","answer":"//","hint":"Two of the same character","tag":"comments","lore":{"concept":"// tells JS to skip the rest of the line.","code":"// heals the player","analogy":"A sticky note for humans, invisible to the machine."}},{"id":"b1n11","type":"p = 0) { ... }","analogy":"A bouncer: true gets in, false does not."}},{"id":"b2n03","type":"predict","q":"How many times does this print?","code":"for (let i = 0; i < 4; i++) {\n  console.log('hit');\n}","answer":"4","hint":"Count i values: 0,1,2,3","tag":"loops","lore":{"concept":"i runs 0,1,2,3 — four passes before i < 4 fails.","code":"for (let i = 0; i < 4; i++)","analogy":"Four laps; the whistle blows at lap 4."}},{"id":"b2n04","type":"bug","q":"Tap the line with a bug","lines":["let hp = 50;","if (hp = 0) {","  console.log('dead');","}"],"bugLine":1,"tag":"comparison","lore":{"concept":"hp = 0 SETS hp to zero. Use === to compare.","code":"if (hp === 0)","analogy":"You meant to check the lock, not change it."}},{"id":"b2n05","type":"mc","q":"When does the else block run?","opts":["when the if condition is false","always","when the if is true","never"],"a":"when the if condition is false","tag":"conditionals","lore":{"concept":"else is the fallback path.","code":"if (win) {...} else {...}","analogy":"Plan B, only when Plan A fails."}},{"id":"b2n06","type":"fill","q":"Keep playing while lives are greater than zero","template":"while (lives ___ 0) { play(); }","answer":">","hint":"Greater than","tag":"loops","lore":{"concept":"The loop repeats while the condition stays true.","code":"while (lives > 0)","analogy":"Keep going until the fuel hits empty."}},{"id":"b2n07","type":"predict","q":"What does this print?","code":"let n = 10;\nif (n > 5) { console.log('big'); }\nelse { console.log('small'); }","answer":"big","hint":"Is 10 > 5?","tag":"conditionals","lore":{"concept":"10 > 5 is true, so only the first branch runs.","code":"if (n > 5)","analogy":"A fork in the road — one path only."}},{"id":"b2n08","type":"predict","q":"What three values print?","code":"for (let i = 3; i > 0; i--) {\n  console.log(i);\n}","answer":"3 2 1","alsoAccept":["3,2,1","321"],"hint":"i counts DOWN","tag":"loops","lore":{"concept":"i-- counts down; the loop stops when i hits 0.","code":"f n element.","code":"btn.onclick = function() { console.log('clicked!'); }","analogy":"A doorbell. Someone presses it, your code runs."},"tag":"events"},{"id":"b2q04","type":"fill","q":"Complete the line that draws a rectangle on a canvas","template":"ctx.___(10, 10, 100, 50);","answer":"fillRect","hint":"Fill plus the shape name","lore":{"concept":"fillRect(x, y, width, height) draws a solid rectangle.","code":"ctx.fillRect(10, 10, 100, 50);","analogy":"A rubber stamp. Place it, press it, rectangle appears."},"tag":"canvas"},{"id":"b2q05","type":"order","q":"Put these lines in order to define and call a function","items":["sayHi();","function sayHi() {","  console.log('Hi');","}"],"correct":[1,2,3,0],"lore":{"concept":"Define the function first, then call it with its name plus brackets.","code":"function sayHi() {\n  console.log('Hi');\n}\nsayHi();","analogy":"Write the recipe first. Then cook it."},"tag":"functions"},{"id":"b2q07","type":"fill","q":"Complete the line that calls a function named jump","template":"___();","answer":"jump","hint":"Just write the function name","lore":{"concept":"To call a function, write its name followed by parentheses.","code":"function jump() { }\njump();","analogy":"The name is the button. The brackets are the press."},"tag":"functions"},{"id":"b2q08","type":"mc","q":"What is ctx typically used for in canvas games?","opts":["The drawing context","A score variable","A type of loop","A CSS property"],"a":"The drawing context","lore":{"concept":"ctx is the 2D rendering context with all the drawing methods.","code":"const ctx = canvas.getContext('2d');","analogy":"ctx is your paintbrush. The canvas is your paper."},"tag":"canvas"},{"id":"b2q09","type":"bug","q":"Tap the line with a bug","lines":["function add(a, b) {","  return a + b;","}","console.log(add(2 3));"],"bugLine":3,"lore":{"concept":"Function arguments must be separated by a comma.","code":"console.log(add(2, 3));","analogy":"Items in a list need commas between them."},"tag":"functions"},{"id":"b2q10","type":"mc","q":"What does return do inside a function?","opts":["Sends a value back to the caller","Ends the whole program","Starts a new loop","Declares a variable"],"a":"Sends a value back to the caller","lore":{"concept":"return sends a value back to wherever the function was called.","code":"function add(a, b) {\n  return a + b;\n}","analogy":"The function goes on an errand. return brings back what you asked for."},"tag":"return"},{"id":"b2q11","type":"predict","q":"What shape does this draw?","code":"ctx.beginPath();\nctx.arc(50, 50, 30, 0, Math.PI*2);\nctx.fill();","answer":"circle","alsoAccept":["a circle","filled circle"],"hint":"arc traces a round path","lore":{"concept":"arc() draws a circular path. fill() colours it in.","code":"ctx.arc(x, y, r, 0, Math.PI*2);\nctx.fill();","analogy":"arc traces the path. fill() colours it in."},"tag":"canvas"},{"id":"b2q12","type":"fill","q":"Complete the line that listens for a keydown event","template":"document.___('keydown', handleKey);","answer":"addEventListener","hint":"Add plus Event plus Listener","lore":{"concept":"addEventListener attaches a function to run when an event fires.","code":"document.addEventListener('keydown', handleKey);","analogy":"A security guard. Watching the door, ready to act."},"tag":"events"},{"id":"b3n01","type":"mc","q":"Difference between defining and calling a function?","opts":["define writes the recipe, call cooks it","they are the same","calling writes it","defining runs it"],"a":"define writes the recipe, call cooks it","tag":"functions","lore":{"concept":"Definitions do nothing until called.","code":"function hi(){...}  hi();","analogy":"A recipe feeds no one until you cook."}},{"id":"b3n02","type":"predict","q":"What does this print?","code":"function boost() {\n  return 50;\n}\nconsole.log(boost());","answer":"50","hint":"return sends the value back","tag":"return","lore":{"concept":"return sends a value back to wherever the function was called."," ,"lore":{"concept":"x += 3 is shorthand for x = x + 3.","code":"let x = 5;\nx += 3; // x is now 8","analogy":"Adding to what you already have, not starting over."},"tag":"variables"},{"id":"b3q03","type":"fill","q":"Access the first item in the array","template":"let first = arr[___];","answer":"0","hint":"Arrays start counting from zero","lore":{"concept":"Arrays are zero-indexed. The first item is always at index 0.","code":"let arr = ['a','b','c'];\narr[0]; // 'a'","analogy":"Floors in a building starting at ground floor zero."},"tag":"arrays"},{"id":"b3q04","type":"mc","q":"What does arr.push(5) do?","opts":["Adds 5 to the end of the array","Removes 5","Adds 5 to the start","Sorts the array"],"a":"Adds 5 to the end of the array","lore":{"concept":"push() adds an item to the end of an array.","code":"let arr = [1,2,3];\narr.push(5); // [1,2,3,5]","analogy":"Adding something to the back of a queue."},"tag":"arrays"},{"id":"b3q05","type":"predict","q":"What is the value of x?","code":"let x = true && false;","answer":"false","hint":"Both sides must be true for AND to return true","lore":{"concept":"&& returns true only if BOTH sides are true.","code":"true && false // false\ntrue && true  // true","analogy":"Both doors must be unlocked to get through."},"tag":"boolean"},{"id":"b3q06","type":"mc","q":"What does typeof 'hello' return?","opts":["'string'","'text'","'word'","'char'"],"a":"'string'","lore":{"concept":"typeof returns a string describing the type of a value.","code":"typeof 'hello' // 'string'","analogy":"Asking what kind of thing something is."},"tag":"types"},{"id":"b3q07","type":"fill","q":"Complete the line that selects an element by its ID","template":"const box = document.___('box');","answer":"getElementById","hint":"get plus Element plus By plus Id","lore":{"concept":"getElementById returns the element with that exact ID.","code":"const box = document.getElementById('box');","analogy":"Calling someone by their unique name in a crowd."},"tag":"events"},{"id":"b3q08","type":"bug","q":"Tap the line with a bug","lines":["let x = 10;","if (x = 5) {","  console.log('yes');","}"],"bugLine":1,"lore":{"concept":"= assigns a value. == compares. Inside if() you need ==.","code":"if (x == 5) { // correct }","analogy":"Asking if someone is 5 vs handing them the number 5."},"tag":"arrays"},{"id":"b3q09","type":"predict","q":"What does this print?","code":"let arr = [10, 20, 30];\nconsole.log(arr.length);","answer":"3","hint":"Count the items in the array","lore":{"concept":"length returns how many items are in the array.","code":"[1,2,3].length // 3","analogy":"Counting the items in a shopping bag."},"tag":"strings"},{"id":"b3q10","type":"mc","q":"What does !== mean?","opts":["Strictly not equal to","Greater than","Not assigned","Less than or equal"],"a":"Strictly not equal to","lore":{"concept":"!== checks values are not equal AND not the same type.","code":"5 !== '5'  // true\n5 !== 5    // false","analogy":"Not just different values but confirmed different identities."},"tag":"comparison"},{"id":"b3q11","type":"order","q":"Put these lines in the correct order","items":["}, 1000);","setTimeout(function() {","  console.log('done');"],"correct":[1,2,0],"lore":{"concept":"A callback is a function passed as an argument, called later.","code":"setTimeout(function() {\n  console.log('done');\n}, 1000);","analogy":"Leaving a note: when you are done, do this."},"tag":"arrays"},{"id":"b3q12","type":"predict","q":"What three values are printed?","code":"for (let i=0; i<3; i++) {\n  console.log(i);\n}","answer":"0 1 2","alsoAccept":["0,1,2","0, 1, 2","012"],"hint":"i starts at 0 and the loop runs 3 times","lore":{"concept":"The loop starts at 0 and runs while i is less than 3.","code":"for (let i=0; i<3; i++) { console.log(i); }","analogy":"Three steps on a staircase starting from the ground."},"tag":"loops"},{"id":"b4n01","type":"predict","q":"What does this print?","code":"console.log('10' - 5);","answer":"5","hint":"Minus has n (function(){
  var cv=document.getElementById("rain"),ctx=cv.getContext("2d"),fx=[],fxKey="";
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;fxKey="";}
  window.addEventListener("resize",resize);resize();
  function buildFx(bm,W,H){
    fx=[];var i;
    if(bm==="b2"){for(i=0;i<14;i++)fx.push({t:"spark",x:Math.random()*W,y:H*(.78+Math.random()*.18),p:Math.random()*6.28});}
    else if(bm==="b3"){for(i=0;i<16;i++)fx.push({t:"ember",x:Math.random()*W,y:Math.random()*H,s:.2+Math.random()*.4,p:Math.random()*6.28});}
    else if(bm==="b4"){for(i=0;i<12;i++)fx.push({t:"drip",x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*1.6});}
    else if(bm==="b5"){for(i=0;i<60;i++)fx.push({t:"star",x:Math.random()*W,y:Math.random()*H*.85,p:Math.random()*6.28,r:Math.random()*1.1+.3});for(i=0;i<8;i++)fx.push({t:"mote",x:Math.random()*W,y:Math.random()*H,s:.15+Math.random()*.3});}
    else{for(i=0;i<42;i++)fx.push({t:"dust",x:Math.random()*W,y:Math.random()*H,s:.12+Math.random()*.3,p:Math.random()*6.28,a:.04+Math.random()*.09});}
  }
  function frame(){
    var W=cv.width,H=cv.height;
    var bm=curBM();
    if(bm+W+"x"+H!==fxKey){buildFx(bm,W,H);fxKey=bm+W+"x"+H;}
    ctx.clearRect(0,0,W,H);
    drawWorldStatic(ctx,W,H,bm);
    var t=Date.now()/1000;
    fx.forEach(function(f){
      if(f.t==="dust"){ctx.fillStyle="rgba(184,174,255,"+f.a+")";ctx.beginPath();ctx.arc(f.x+Math.sin(t+f.p)*8,f.y,1.1,0,6.283);ctx.fill();f.y-=f.s;if(f.y<-4){f.y=H+4;f.x=Math.random()*W;}}
      else if(f.t==="spark"){var a=.25+.55*Math.abs(Math.sin(t*3+f.p));ctx.fillStyle="rgba(128,255,255,"+(a*.5).toFixed(3)+")";ctx.beginPath();ctx.arc(f.x,f.y,1.6,0,6.283);ctx.fill();}
      else if(f.t==="ember"){ctx.fillStyle="rgba(255,190,90,"+(.10+.14*Math.abs(Math.sin(t*2+f.p))).toFixed(3)+")";ctx.beginPath();ctx.arc(f.x+Math.sin(t+f.p)*5,f.y,1.3,0,6.283);ctx.fill();f.y-=f.s;if(f.y<-3){f.y=H+3;f.x=Math.random()*W;}}
      else if(f.t==="drip"){ctx.strokeStyle="rgba(64,220,110,.3)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x,f.y+7);ctx.stroke();f.y+=f.s;if(f.y>H){f.y=-8;f.x=Math.random()*W;}}
      else if(f.t==="star"){ctx.fillStyle="rgba(224,200,255,"+(.2+.5*Math.abs(Math.sin(t*1.5+f.p))).toFixed(3)+")";ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();}
      else if(f.t==="mote"){ctx.fillStyle="rgba(192,96,255,.22)";ctx.beginPath();ctx.arc(f.x,f.y,1.4,0,6.283);ctx.fill();f.y-=f.s;if(f.y<-3){f.y=H+3;f.x=Math.random()*W;}}
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

  }

}
function editDist1(a,b){
  if(a===b)return true;
  var la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1)return false;
  var i=0,j=0,diff=0;
  while(i<la&&j<lb){
    if(a[i]!==b[j]){diff++;if(diff>1)return false;
      if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}
    }else{i++;j++;}
  }
  return diff+(la-i)+(lb-j)<=1;
}

/* ── TEACHER DASHBOARD ────────────────────────────────────── */
