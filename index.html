<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060e;--sur:#0d0d1a;--bor:#2a2a45;
  --amb:#e8913a;--ambL:#ffc060;--ambD:#7a3d10;
  --cyn:#3ecfcf;--cynL:#80ffff;

}
html,body{background:var(--bg);color:var(--txt);font-family:var(--ff);min-height:100vh;overflow-x:hidden}
button{font-family:var(--ff);cursor:pointer;transition:opacity .2s}
button:hover:not(:disabled){opacity:.85}
button:disabled{opacity:.4;cursor:default}
input{font-family:var(--ff)}
canvas{display:block}
#app{min-height:100vh;position:relative}
#rain{position:fixed;inset:0;pointer-events:none;z-index:0}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(6,6,14,.9) 100%);pointer-events:none;z-index:1}
.lay{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:clamp(.8rem,3vw,1.8rem) clamp(.8rem,3vw,1.4rem)}
.col{display:flex;flex-direction:column;align-items:center}
.panel{background:rgba(10,10,20,.92);border:1px solid var(--bor);border-radius:4px}
.panel-c{background:rgba(6,6,14,.97);border:1px solid var(--cyn);border-radius:4px;position:relative}
.panel-c::before,.panel-c::after{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyn),transparent)}
.panel-c::before{top:0}.panel-c::after{bottom:0}
.btn{background:transparent;border:1.5px solid var(--amb);color:var(--amb);font-family:var(--serif);font-size:clamp(10px,2vw,13px);letter-spacing:.2em;padding:clamp(8px,2vw,11px) clamp(14px,3.5vw,28px);clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%)}
.btn-c{border-color:var(--cyn)!important;color:var(--cyn)!important}
.btn-r{border-color:var(--red)!important;color:var(--red)!important}
.btn-s{background:transparent;border:1px solid var(--bor);color:var(--mut);font-size:clamp(9px,1.8vw,11px);letter-spacing:.15em;padding:clamp(6px,1.5vw,9px) clamp(10px,2.5vw,18px)}
.btn-s:hover:not(:disabled){border-color:var(--mut);color:var(--txt)}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(6px,1.5vh,10px)}
.tbar{height:4px;background:var(--sur);border-radius:2px;border:1px solid var(--bor);overflow:hidden;margin-bottom:3px}
.tfill{height:100%;border-radius:2px;transition:width 1s linear,background .4s}
.arena-w{position:relative;width:100%;padding-bottom:23%;border:1px solid var(--bor);border-radius:4px;overflow:hidden;margin-bottom:clamp(10px,2vh,14px)}
.arena-w>div{position:absolute;inset:0}
.fov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,9px);margin-bottom:clamp(8px,1.8vh,12px)}
.opt{background:rgba(10,10,22,.8);border:1px solid var(--bor);color:var(--txt);padding:clamp(9px,2vw,13px) clamp(8px,2vw,11px);border-radius:4px;font-size:clamp(11px,2.2vw,13px);text-align:left;line-height:1.4;transition:border .15s,background .15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--amb)}
.opt.ok{border:2px solid var(--grn)!important;color:var(--grn)!important;background:rgba(64,216,128,.06)}
.opt.no{border:2px solid var(--red)!important;color:var(--red)!important;background:rgba(224,80,80,.06)}
.opt.hl{border:2px solid var(--amb)!important;color:var(--ambL)!important;background:rgba(232,145,58,.07)}
.opt.el{opacity:.25;text-decoration:line-through;cursor:default}
.code-b{background:rgba(0,0,0,.65);border-left:2px solid var(--amb);color:var(--ambL);padding:clamp(8px,2vw,12px);font-size:clamp(10px,2.2vw,12px);line-height:1.8;overflow-x:auto;margin-bottom:10px;white-space:pre;font-family:var(--ff);border-radius:0 4px 4px 0}
.duck-row{display:flex;align-items:flex-end;gap:clamp(6px,1.5vw,10px);margin-top:clamp(6px,1.5vh,10px)}
.dbub{padding:7px clamp(10px,2.5vw,14px);font-size:clamp(10px,1.8vw,12px);color:var(--mut);font-style:italic;line-height:1.5;max-width:min(320px,72vw)}
.badge{font-size:clamp(7px,1.4vw,9px);letter-spacing:.2em;padding:3px 8px;border-radius:3px;display:inline-flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.ban{position:fixed;top:clamp(58px,10vh,78px);left:50%;transform:translateX(-50%);padding:9px 24px;font-family:var(--serif);letter-spacing:.2em;white-space:nowrap;z-index:40;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);background:var(--sur)}
.ban-a{border:1px solid var(--ambD);color:var(--amb);font-size:clamp(8px,1.8vw,11px)}
.ban-c{border:1px solid var(--cyn);color:var(--cyn);font-size:clamp(8px,1.8vw,11px);top:clamp(98px,16vh,118px)}
.stat-g{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:clamp(10px,2.5vh,16px)}
.stat-c{padding:clamp(8px,2vw,12px) clamp(10px,2.5vw,16px);text-align:center;min-width:78px}
.lb-r{display:flex;justify-content:space-between;font-size:clamp(10px,2vw,12px);padding:5px 12px;border-radius:4px;margin-bottom:3px;border:1px solid var(--bor)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:60}
.mbox{background:#05050d;border:1px solid var(--bor);border-top:1px solid var(--cyn);border-radius:6px;padding:clamp(14px,3vw,22px);max-width:min(460px,94vw);width:94%;max-height:80vh;overflow-y:auto}
.blank-in{background:rgba(13,13,26,.9);border:1.5px solid var(--bor);color:var(--txt);font-size:clamp(12px,2.5vw,15px);padding:10px 14px;border-radius:4px;width:100%;outline:none;text-align:center;transition:border .2s}
.blank-in:focus{border-color:var(--amb)}
.blank-in.ok{border-color:var(--grn);color:var(--grn)}
.blank-in.no{border-color:var(--red)}
.order-item{background:rgba(10,10,22,.85);border:1px solid var(--bor);color:var(--txt);padding:8px 12px;border-radius:4px;font-size:clamp(10px,2vw,12px);cursor:pointer;user-select:none;margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:border .15s;width:100%;text-align:left}
.order-item.sel{border-color:var(--amb);background:rgba(232,145,58,.08)}
.order-item.cp{border-color:var(--grn)}
.order-item.wp{border-color:var(--red)}
.drag-num{font-size:10px;color:var(--mut);min-width:16px;flex-shrink:0}
.bug-line{background:rgba(10,10,22,.85);border:1px solid var(--bor);color:var(--ambL);padding:7px 12px;border-radius:3px;font-size:clamp(10px,2vw,12px);cursor:pointer;margin-bottom:4px;font-family:var(--ff);transition:border .15s;text-align:left;width:100%}
.bug-line:hover{border-color:var(--amb)}
.bug-line.ok{border-color:var(--grn);background:rgba(64,216,128,.08);color:var(--grn)}
.bug-line.no{border-color:var(--red);background:rgba(224,80,80,.08);color:var(--red)}
.pred-in{background:rgba(13,13,26,.9);border:1.5px solid var(--bor);color:var(--txt);font-size:clamp(12px,2.5vw,15px);padding:10px 14px;border-radius:4px;width:100%;outline:none;text-align:center;transition:border .2s;margin-bottom:10px}
.pred-in:focus{border-color:var(--cyn)}
.pred-in.ok{border-color:var(--grn);color:var(--grn)}
.pred-in.no{border-color:var(--red)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--sur)}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:2px}
</style>
</head>

    var data={best_score:p.best_score,total_score:p.total_score,benchmark:p.benchmark,session_count:p.session_count,wrong_ids:p.wrong_ids,lore_lib:p.lore_lib,evo_stage:p.evo_stage,last_seen:new Date().toISOString()};

function loadLB(){return sb.getLB().then(function(r){return(r&&r.length)?r:ls.getLB();});}
function updateLB(name,best_score,benchmark){
  return loadLB().then(function(lb){
    var next=lb.filter(function(e){return e.name.toLowerCase()!==name.toLowerCase();});
    next.push({name:name,best_score:best_score,benchmark:benchmark,updated_at:new Date().toISOString()});

  });
}

(function(){
  var cv=document.getElementById("rain"),ctx=cv.getContext("2d"),rain=[];
  function resize(){
    cv.width=window.innerWidth;cv.height=window.innerHeight;rain=[];
    for(var i=0;i<50;i++)rain.push({x:Math.random()*cv.width,y:Math.random()*cv.height,speed:1.4+Math.random()*2,len:12+Math.random()*16,alpha:.03+Math.random()*.06});
  }
  window.addEventListener("resize",resize);resize();
  function frame(){
    var W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#090915";
    [[.1,.28,.04],[.2,.14,.03],[.75,.18,.035],[.85,.07,.025],[.9,.24,.03]].forEach(function(s){ctx.fillRect(W*s[0]-W*s[2]/2,H*s[1],W*s[2],H-H*s[1]);});
    ctx.strokeStyle="#0d0d1c";ctx.lineWidth=12;
    [[0,.9,.35,.05,.7,.9],[.5,.9,.8,.04,1.1,.9]].forEach(function(a){ctx.beginPath();ctx.moveTo(W*a[0],H*a[1]);ctx.quadraticCurveTo(W*a[2],H*a[3],W*a[4],H*a[5]);ctx.stroke();});
    ctx.lineCap="round";
    rain.forEach(function(r){
      ctx.strokeStyle="rgba(20,25,55,"+r.alpha+")";ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-3,r.y+r.len);ctx.stroke();
      r.y+=r.speed;if(r.y>H){r.y=-r.len;r.x=Math.random()*W;}
    });
    requestAnimationFrame(frame);
  }
  frame();
})();

  if(G.lb.length){var lbW=mk("div",{"style":"width:100%;max-width:300px"});G.lb.slice(0,5).forEach(function(e,i){var r=mk("div",{"class":"lb-r","style":e.name.toLowerCase()===(p?p.name:"").toLowerCase()?"background:"+C.cyn+"12":"background:"+C.sur});ap(r,mk("span",{"style":"color:"+(e.name.toLowerCase()===(p?p.name:"").toLowerCase()?C.cyn:C.txt)},[(i+1)+". "+e.name]),mk("span",{"style":"color:"+C.cyn},[String(e.best_score)]));ap(lbW,r);});ap(wrap,lbW);}
  ap(app,wrap);if(G.showLib)renderLibModal(app);
}

/* ── LORE LIBRARY ─────────────────────────────────────────── */
function renderLibModal(app){
  var lib=G.profile&&G.profile.lore_lib?G.profile.lore_lib:[];
  var overlay=mk("div",{"class":"modal"});overlay.addEventListener("click",function(e){if(e.target===overlay){G.showLib=false;render();}});
  var box=mk("div",{"class":"mbox"});ap(box,mkP("LORE LIBRARY","font-size:clamp(8px,1.5vw,10px);letter-spacing:.3em;color:var(--cyn);margin-bottom:14px"));
  if(!lib.length)ap(box,mkP("No entries yet. Get some answers wrong.","color:"+C.mut+";font-size:12px"));
  lib.forEach(function(c){var entry=mk("div",{"style":"border:1px solid "+C.bor+";border-radius:4px;padding:clamp(10px,2.5vw,14px);margin-bottom:10px"});ap(entry,mkP(c.concept,"font-size:clamp(11px,2vw,13px);color:var(--txt);margin-bottom:7px"));var cb=mk("div",{"class":"code-b","style":"margin-bottom:7px"});cb.textContent=c.code;ap(entry,cb,mkP(c.analogy,"font-size:clamp(10px,1.8vw,11px);color:"+C.mut+";font-style:italic;margin:0"));ap(box,entry);});
  ap(box,mkBtn("CLOSE","btn-s",function(){G.showLib=false;render();}));ap(overlay,box);ap(app,overlay);
}

/* ── TEACHER LOGIN ────────────────────────────────────────── */
function renderTeacherLogin(app){
  app.innerHTML="";
  var wrap=ap(mk("div",{"class":"lay col","style":"padding-top:3rem"}));ap(wrap,mkP("TEACHER ACCESS","font-size:clamp(8px,1.5vw,10px);letter-spacing:.35em;color:var(--mut);margin-bottom:20px"));
  var dcv=mk("canvas");ap(wrap,dcv);setTimeout(function(){dcv.width=54;dcv.height=54;drawDuck(dcv.getContext("2d"),true,27,27,44);},50);
  ap(wrap,mkP('"Duck verifies all credentials personally."',"font-size:12px;color:"+C.mut+";font-style:italic;margin:12px 0 20px;text-align:center;max-width:220px"));
  var inp=mk("input",{"type":"password","placeholder":"teacher password...","maxlength":"32","aria-label":"Teacher password","style":"background:rgba(13,13,26,.85);border:1px solid var(--bor);border-radius:3px;padding:10px 16px;font-size:clamp(12px,2.5vw,14px);color:var(--txt);width:min(210px,72vw);text-align:center;outline:none;margin-bottom:14px"});
  inp.value=G.teacherInput;inp.addEventListener("input",function(e){G.teacherInput=e.target.value;});inp.addEventListener("keydown",function(e){if(e.key==="Enter")tryTeacher();});ap(wrap,inp);
  var bRow=mk("div",{"style":"display:flex;gap:10px;margin-bottom:16px"});ap(bRow,mkBtn("ENTER","btn",tryTeacher),mkBtn("BACK","btn-s",function(){G.screen="menu";render();}));ap(wrap,bRow);
  if(G.duckOn&&G.duckMsg){var dr=mk("div",{"class":"duck-row"});var dcv2=mk("canvas");ap(dr,dcv2);setTimeout(function(){dcv2.width=38;dcv2.height=38;drawDuck(dcv2.getContext("2d"),true,19,19,32);},50);ap(dr,mkP('"'+G.duckMsg+'"',"font-size:11px;color:"+C.mut+";font-style:italic"));ap(wrap,dr);}
  ap(app,wrap);
}
function tryTeacher(){if(G.teacherInput===T_PASS)renderTeacherDashboard();else duck("Wrong password. Duck is disappointed. Deeply.");}

/* ── TEACHER DASHBOARD ────────────────────────────────────── */
function renderTeacherDashboard(){
  var app=document.getElementById("app");app.innerHTML="";
  ap(app,mkP("Loading class data...","color:var(--mut);font-size:12px;padding:2rem;text-align:center"));
  Promise.all([sb.getAllProfiles(),loadLB(),sb.getCS("team_mode"),sb.getCS("boss_battle")]).then(function(res){
    var students=res[0],lb=res[1],tm=res[2],bb=res[3];
    var teamData=tm&&tm.data?tm.data:{active:false,teams:[]};
    var bossData=bb&&bb.data?bb.data:{active:false};
    var today=Date.now()-86400000;
    app.innerHTML="";
    var wrap=mk("div",{"class":"lay","style":"box-sizing:border-box"});
    var hdr=mk("div",{"style":"display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"});
    var h2=mk("h2",{"style":"font-family:var(--serif);font-size:clamp(16px,3.5vw,20px);color:var(--amb);margin:0"});h2.textContent="TEACHER DASHBOARD";ap(hdr,h2,mkBtn("BACK","btn-s",function(){G.screen="menu";render();}));ap(wrap,hdr);
    var pt=students.filter(function(s){return s.last_seen&&new Date(s.last_seen).getTime()>today;});
    var og=mk("div",{"style":"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px"});
    [[students.length,C.cyn,"STUDENTS"],[pt.length,C.grn,"TODAY"],[lb&&lb[0]?lb[0].best_score:0,C.amb,"TOP SCORE"]].forEach(function(s){var sc=mkPanel("panel stat-c");ap(sc,mkP(s[2],"font-size:clamp(7px,1.4vw,9px);color:"+C.mut+";margin-bottom:3px;letter-spacing:.2em"),mkP(String(s[0]),"font-family:var(--serif);font-size:clamp(18px,4vw,24px);color:"+s[1]));ap(og,sc);});ap(wrap,og);
    /* boss */
    var bp=mkPanel("panel","padding:clamp(12px,2.5vw,16px);margin-bottom:14px;border-color:"+C.cyn);ap(bp,mkP("BOSS BATTLE","font-size:clamp(8px,1.5vw,10px);letter-spacing:.3em;color:"+C.cyn+";margin-bottom:10px"));
    if(bossData.active){
      var hp3=bossData.bossHp>0?Math.round((bossData.currentHp/bossData.bossHp)*100):0;
      ap(bp,mkP(bossData.bossName||"","font-family:var(--serif);font-size:clamp(13px,2.5vw,16px);color:"+C.red+";margin-bottom:4px"),mkP(bossData.bossFlavor||"","font-size:11px;color:"+C.mut+";font-style:italic;margin-bottom:8px"));
      var hpb2=mk("div",{"style":"height:14px;background:"+C.sur+";border-radius:7px;border:1px solid "+C.red+";overflow:hidden;margin-bottom:10px"});ap(hpb2,mk("div",{"style":"height:100%;width:"+hp3+"%;background:"+C.red+";border-radius:7px"}));ap(bp,hpb2,mkP((bossData.currentHp||0)+" / "+(bossData.bossHp||0)+" HP","font-size:10px;color:"+C.mut+";margin-bottom:10px"));
      ap(bp,mkBtn("END BOSS BATTLE","btn btn-r",function(){sb.setCS("boss_battle",{active:false,bossName:"",bossHp:100,currentHp:100}).then(function(){renderTeacherDashboard();});}));
    }else{
      ap(bp,mkP("Launch a boss for the whole class to defeat together.","font-size:11px;color:"+C.mut+";margin-bottom:10px"),mkBtn("LAUNCH BOSS","btn btn-r",function(){var boss=rnd(BOSSES);sb.setCS("boss_battle",{active:true,bossName:boss.name,bossFlavor:boss.flavor,bossHp:boss.hp,currentHp:boss.hp,activatedAt:Date.now()}).then(function(){renderTeacherDashboard();});}));
    }
    ap(wrap,bp);
    /* team */
    var numTeams=3;
    var tp=mkPanel("panel","padding:clamp(12px,2.5vw,16px);margin-bottom:14px");ap(tp,mkP("TEAM MODE","font-size:clamp(8px,1.5vw,10px);letter-spacing:.3em;color:"+C.amb+";margin-bottom:10px"));
    if(teamData.active){
      (teamData.teams||[]).forEach(function(t){var td=mk("div",{"style":"margin-bottom:8px"});ap(td,mkP(t.name+" — "+(t.score||0)+" pts — "+((t.members||[]).length)+" students","font-size:clamp(9px,1.6vw,11px);color:"+t.col+";margin-bottom:3px"));var tb=mk("div",{"style":"height:8px;background:"+C.sur+";border-radius:4px;border:1px solid "+C.bor+";overflow:hidden"});ap(tb,mk("div",{"style":"height:100%;width:"+Math.min(100,(t.score||0)/5)+"%;background:"+t.col}));ap(td,tb,mkP((t.members||[]).join(", ")||"No members yet","font-size:10px;color:"+C.mut+";margin-top:2px"));ap(tp,td);});
      ap(tp,mkBtn("END TEAM MODE","btn",function(){sb.setCS("team_mode",{active:false,teams:[]}).then(function(){renderTeacherDashboard();});}));
    }else{
      ap(tp,mkP("Students are auto-split. Each correct answer earns team points.","font-size:11px;color:"+C.mut+";margin-bottom:10px"));
      var tRow=mk("div",{"style":"display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap"});ap(tRow,mkP("Teams:","font-size:11px;color:"+C.mut));
      var tBtns=[];
      [3,4].forEach(function(n){var tb2=mkBtn(String(n),"btn-s",function(){numTeams=n;tBtns.forEach(function(b){b.style.borderColor=C.bor;});tb2.style.borderColor=C.amb;});if(n===3)tb2.style.borderColor=C.amb;tBtns.push(tb2);ap(tRow,tb2);});ap(tp,tRow);
      ap(tp,mkBtn("ACTIVATE TEAM MODE","btn",function(){
        var names=students.map(function(s){return s.name;}).filter(Boolean);var sn=shuffle(names);
        var teams=[];for(var ti=0;ti<numTeams;ti++)teams.push({id:ti,name:C.tNames[ti],col:C.tCols[ti],members:[],score:0});
        sn.forEach(function(n,i){teams[i%numTeams].members.push(n);});
        sb.setCS("team_mode",{active:true,teams:teams,activatedAt:Date.now()}).then(function(){renderTeacherDashboard();});
      },students.length===0));
    }
    ap(wrap,tp);
    /* roster */
    var rHdr=mk("div",{"style":"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"});ap(rHdr,mkP("STUDENT ROSTER","font-size:clamp(8px,1.5vw,10px);letter-spacing:.3em;color:var(--txt)"));
    var copyBtn=mkBtn("COPY TO SPREADSHEET","btn-s",function(){
      var header="Name\tBest Score\tBenchmark\tSessions\tLore Cards\tLast Seen";
      var rows=students.map(function(s){return s.name+"\t"+s.best_score+"\t"+["","I","II","III","IV"][s.benchmark]+"\t"+s.session_count+"\t"+((s.lore_lib||[]).length)+"\t"+(s.last_seen?new Date(s.last_seen).toLocaleDateString():"Never");});
      navigator.clipboard.writeText([header].concat(rows).join("\n")).then(function(){copyBtn.textContent="COPIED!";setTimeout(function(){copyBtn.textContent="COPY TO SPREADSHEET";},2000);});
    });ap(rHdr,copyBtn);
    var rp=mkPanel("panel","padding:clamp(12px,2.5vw,16px);margin-bottom:14px");ap(rp,rHdr);
    if(!students.length){ap(rp,mkP("No students have played yet.","color:"+C.mut+";font-size:11px"));}
    else{
      var tbl=mk("table",{"style":"width:100%;font-size:clamp(9px,1.6vw,11px);border-collapse:collapse"});
      var thead=mk("tr",{"style":"color:"+C.mut+";text-align:left"});
      ["Name","Best","BM","Sessions","Lore","Last seen"].forEach(function(hh){ap(thead,mk("th",{"style":"padding:4px 8px;border-bottom:1px solid "+C.bor+";font-weight:400;letter-spacing:.1em"},[hh]));});ap(tbl,thead);
      students.forEach(function(s){
        var isToday=s.last_seen&&new Date(s.last_seen).getTime()>today;
        var tr=mk("tr",{"style":"border-bottom:1px solid "+C.dim});
        [[s.name,isToday?C.grn:C.txt],[String(s.best_score),C.cyn],[["","I","II","III","IV"][s.benchmark]||String(s.benchmark),C.amb],[String(s.session_count),C.txt],[String((s.lore_lib||[]).length),C.txt],[s.last_seen?new Date(s.last_seen).toLocaleDateString():"Never",C.mut]].forEach(function(v){ap(tr,mk("td",{"style":"padding:5px 8px;color:"+v[1]},[v[0]]));});
        ap(tbl,tr);
      });ap(rp,tbl);
    }
    ap(wrap,rp,mkBtn("REFRESH","btn-s",function(){renderTeacherDashboard();}));ap(app,wrap);
  });
}

/* ── Boot ─────────────────────────────────────────────────── */
loadLB().then(function(lb){G.lb=lb||[];render();});
</script>
